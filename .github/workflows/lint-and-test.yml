name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci || npm install

      - name: Lint (syntax check)
        working-directory: scripts
        run: |
          for f in *.js; do
            node --check "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Run deterministic suite (npm test)
        working-directory: scripts
        run: npm test

      - name: Run high-level driver (ayoa-test-suite present-mode)
        working-directory: scripts
        run: node ayoa-test-suite.js --test test-present-mode

  coverage-summary:
    name: Aggregate coverage summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "Status: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
